<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>法宝背包填充助手 · 我要当老祖</title>
<style>
  :root {
    --bg:#f4f6fa; --panel:#ffffff; --ink:#1f2330; --muted:#6b7280;
    --line:#e5e7eb; --accent:#7c3aed; --accent-d:#5b21b6;
    --accent2:#0ea5a4; --blocked:#2b2f3a; --empty:#eef1f5; --ok:#1f9d55; --warn:#d97706;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5; }
  header { padding:16px 22px; background:linear-gradient(120deg,#5b21b6,#0ea5a4); color:#fff; }
  header h1 { margin:0; font-size:20px; letter-spacing:.5px; }
  header p { margin:5px 0 0; font-size:12.5px; opacity:.92; }
  main { display:grid; grid-template-columns:minmax(0,1fr); gap:16px; padding:16px; max-width:1680px; margin:0 auto; }
  main>section { min-width:0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .card h2 { font-size:16px; margin:0 0 10px; }
  .card h3 { font-size:14px; margin:0 0 8px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .cap { font-size:12px; color:var(--muted); margin:8px 0; }
  label { font-size:12px; color:var(--muted); display:block; margin:8px 0 3px; }
  select,input[type=number],input[type=text]{ width:100%; padding:6px 8px; border:1px solid var(--line);
    border-radius:8px; font-size:13px; background:#fff; color:var(--ink); }
  button { cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink);
    padding:7px 10px; border-radius:8px; font-size:13px; transition:.15s; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  button.primary:hover { background:var(--accent-d); color:#fff; }
  button.ghost { background:transparent; }
  .hint { color:var(--muted); font-size:11.5px; margin-top:6px; line-height:1.5; }
  .mt { margin-top:12px; }
  /* 背包空间 */
  .space-body { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:24px; align-items:start; }
  .space-controls { display:grid; grid-template-columns:1fr 1fr; gap:8px; max-width:540px; }
  .space-controls .full { grid-column:1 / -1; }
  .add-fields { display:flex; flex-wrap:wrap; gap:8px 12px; margin-top:10px; max-width:560px; }
  .add-fields>div { display:flex; flex-direction:column; gap:3px; }
  .add-fields label { font-size:12px; color:var(--c-text-dim); }
  .add-fields input, .add-fields select { width:122px; box-sizing:border-box; }
  .inv-search { width:auto; min-width:140px; }
  .grid { display:grid; gap:3px; }
  .cell { width:26px; height:26px; border-radius:5px; background:var(--empty); border:1px solid #dfe3ea;
    display:flex; align-items:center; justify-content:center; font-size:11px; user-select:none; }
  .cell.tiny { width:18px; height:18px; border-radius:4px; }
  .cell.blocked { background:var(--blocked); border-color:#1a1d26; }
  .cell.sel { background:var(--accent); border-color:var(--accent-d); color:#fff; }
  .cell.click { cursor:pointer; }
  /* —— 方案展示优化：gap=0 零基底，同件无缝贴合，异件靠边框分隔 —— */
  .pg-grid { gap:0; align-items:start; justify-items:start; }
  .pg-cell2 { position:relative; box-sizing:border-box; border:none; border-radius:3px; }
  .pg-bt{ border-top:3px solid #111!important; } .pg-bb{ border-bottom:3px solid #111!important; }
  .pg-bl{ border-left:3px solid #111!important; } .pg-br{ border-right:3px solid #111!important; }
  /* 法宝清单表格 */
  .table-scroll { overflow-x:auto; overflow-y:auto; border:1px solid var(--line); border-radius:9px; max-height:480px; }
  table.inv-table { border-collapse:collapse; width:100%; font-size:12.5px; }
  .inv-table th, .inv-table td { border-bottom:1px solid var(--line); padding:7px 8px; text-align:left; vertical-align:middle; }
  .inv-table thead th { position:sticky; top:0; background:#f8f9fb; z-index:5; font-weight:600; color:var(--muted); }
  .inv-table tbody tr:hover { background:#fafbff; }
  .inv-table input[type=number]{ width:64px; }
  .inv-table input[type=text]{ width:120px; }
  .inv-table select { width:100px; }
  .inv-table select.btype, .inv-table select.battr { width:auto; min-width:120px; }
  .inv-table .mini { display:grid; gap:2px; }
  .inv-table .mini .mc { width:14px; height:14px; border-radius:3px; border:1px solid rgba(0,0,0,.15); }
  .inv-table .shape-td { white-space:nowrap; }
  .inv-table .mini-wrap { margin-bottom:3px; }
  .inv-table .shapein { width:84px !important; padding:3px 5px !important; font-size:11px; font-family:ui-monospace,Consolas,monospace; }
  .inv-table .del { color:#c0392b; border-color:#f0c5bf; padding:3px 8px; }
  .inv-table .del:hover { background:#c0392b; color:#fff; border-color:#c0392b; }
  /* 添加法宝面板 */
  details.add-panel { margin-top:10px; border:1px solid var(--line); border-radius:9px; padding:0 10px; }
  details.add-panel summary { cursor:pointer; padding:8px 0; font-size:13px; font-weight:600; }
  .toolbar { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .toolbar button { padding:5px 8px; font-size:12px; }
  .empty-note{ color:var(--muted); font-size:12px; padding:10px 4px; }
  /* 结果区 */
  .output-wrap { display:grid; grid-template-columns:minmax(660px,1.35fr) minmax(320px,.65fr); gap:16px; align-items:start; }
  .result-main { display:grid; grid-template-columns:auto minmax(320px,1fr); gap:24px; align-items:start; min-width:0; }
  .plans { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  @media (max-width:760px){ .plans{ grid-template-columns:1fr; } }
  .plan-card { border:1px solid var(--line); border-radius:12px; padding:12px; background:#fcfcfe; cursor:pointer; transition:.15s; }
  .plan-card:hover { border-color:var(--accent); }
  .plan-card.selected { border-color:var(--accent); box-shadow:0 0 0 3px rgba(124,58,237,.18); background:#fff; }
  .plan-card h3 { margin:0 0 8px; font-size:13.5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 12px; margin:8px 0; }
  .legend .item { display:flex; align-items:center; gap:5px; font-size:11.5px; }
  .legend .sw { width:12px; height:12px; border-radius:3px; border:1px solid rgba(0,0,0,.15); }
  .planbar { display:flex; gap:8px; margin-top:8px; align-items:center; }
  .plan-text { white-space:pre-wrap; font-family:Consolas,monospace; font-size:11px; background:#0f1320;
    color:#d7e0f4; padding:10px; border-radius:8px; max-height:200px; overflow:auto; margin-top:8px; display:none; }
  .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px; background:#eef2ff; color:var(--accent-d); }
  .pill.warn{ background:#fff4e5; color:var(--warn);} .pill.ok{ background:#e7f7ee; color:var(--ok);} .pill.t2{ background:#e6fbfa; color:#0b7c7b; }
  /* 求解设置 / 统计 */
  .embedded-solver .toolbar { margin-top:8px; }
  .weights { display:flex; gap:8px; margin-top:8px; }
  .weights>div { flex:1; min-width:0; }
  .weights input { width:100%; }
  .weights .wmsg { font-size:11px; color:var(--muted); margin-top:3px; }
  .inv-table input[type=number].anum { width:80px; }
  .attr-line { font-size:12px; color:var(--muted); margin:6px 0; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .stats .stat { background:#f8f9fb; border:1px solid var(--line); border-radius:9px; padding:8px 10px; }
  .stats .stat .k { font-size:11px; color:var(--muted); }
  .stats .stat .v { font-size:17px; font-weight:700; }
  #statusBox { background:#0f1320; color:#d7e0f4; padding:10px; border-radius:8px; font-size:12px; white-space:pre-wrap;
    min-height:64px; margin:8px 0 0; max-height:200px; overflow:auto; }
  /* 方案详情面板（点击方案卡后右侧实时显示） */
  .plan-detail { margin-top:10px; border:1px dashed var(--line); border-radius:10px; padding:10px; background:#fcfcfe; max-height:560px; overflow:auto; }
  .plan-detail .pd-empty { color:var(--muted); font-size:12.5px; padding:8px 2px; }
  .plan-detail h4 { margin:0 0 8px; font-size:13px; }
  .plan-detail .pd-table { border-collapse:collapse; width:100%; font-size:12px; margin-top:8px; }
  .plan-detail .pd-table th, .plan-detail .pd-table td { border-bottom:1px solid var(--line); padding:5px 7px; text-align:left; }
  .plan-detail .pd-table thead th { color:var(--muted); font-weight:600; background:#f8f9fb; }
  .plan-detail .pd-table .pd-total { font-weight:700; background:#f3f0ff; }
  .plan-detail .pd-copy { margin-top:8px; }
  /* 历史求解 */
  .history-panel { margin-top:14px; border:1px solid var(--line); border-radius:9px; padding:0 10px; }
  .history-panel summary { cursor:pointer; padding:8px 0; font-size:13px; font-weight:600; }
  .history-list { display:flex; flex-direction:column; gap:6px; padding:4px 0 10px; }
  .hist-row { display:flex; gap:8px; align-items:center; justify-content:space-between; border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
  .hist-info { font-size:12.5px; }
  .hist-time { color:var(--muted); font-size:11px; margin-left:6px; }
  /* 分段开关 */
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { border:none; background:#fff; padding:6px 11px; font-size:12px; border-radius:0; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button.on { background:var(--accent); color:#fff; }
  .help-card ol { margin:6px 0 0; padding-left:20px; font-size:13px; }
  .help-card li { margin:5px 0; }
  /* 横屏：区域网格（与对方同构：space / library / result / help 自上而下；library 已合并为单表占满） */
  @media (min-width:900px) and (orientation:landscape){
    main { grid-template-columns:minmax(0,1fr); grid-template-areas:"space" "library" "result" "help"; }
    main>section { display:contents; }
    .space-card { grid-area:space; }
    .lib-card { grid-area:library; }
    .result-card { grid-area:result; }
    .help-card { grid-area:help; }
  }
  @media (max-width:899px){
    .space-body, .output-wrap, .result-main { grid-template-columns:1fr; }
    .output-wrap, .result-main { gap:16px; }
  }
  /* 组别 */
  .group-bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:4px 0 0; }
  .group-bar select { width:auto; min-width:130px; flex:0 0 auto; }
  details.group-panel, details.cloud-panel { margin-top:10px; border:1px solid var(--line); border-radius:9px; padding:0 10px; }
  details.group-panel summary, details.cloud-panel summary { cursor:pointer; padding:8px 0; font-size:13px; font-weight:600; }
  .group-list { display:flex; flex-direction:column; gap:6px; padding:4px 0 10px; }
  .group-row { display:flex; gap:8px; align-items:center; }
  .group-row .gname { width:170px; }
  .group-row .del { padding:3px 8px; }
  .inv-table select.grp { width:108px; }
  /* 重点法宝：整行高亮 + 名称/数值标红加粗 */
  tr.key-row { background:rgba(230,52,43,0.08); }
  tr.key-row td .nm,
  tr.key-row td .anum,
  tr.key-row td .brate,
  tr.key-row td .cnum { color:#e6342b; font-weight:700; }
  .keystar { cursor:pointer; border:none; background:none; font-size:16px; line-height:1; padding:2px 4px; color:#c7ccd6; }
  .keystar.on { color:#e6342b; }
  .inv-table .dt { padding:3px 8px; color:var(--accent-d); border-color:#ddd6fe; }
  .inv-table .dt:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  /* 详情弹窗 */
  .modal-mask { position:fixed; inset:0; background:rgba(15,19,32,.45); display:none; z-index:100;
    align-items:flex-start; justify-content:center; overflow:auto; padding:36px 16px; }
  .modal-mask.on { display:flex; }
  .modal { background:#fff; border-radius:14px; width:min(820px,100%); box-shadow:0 20px 60px rgba(0,0,0,.28); }
  .modal-hd { display:flex; align-items:center; gap:10px; padding:13px 18px; border-bottom:1px solid var(--line); }
  .modal-hd h3 { margin:0; font-size:15px; flex:1; }
  .modal-bd { padding:14px 18px; max-height:68vh; overflow:auto; }
  .modal-ft { padding:11px 18px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; align-items:center; }
  .modal .x { border:none; background:none; font-size:20px; line-height:1; color:var(--muted); padding:2px 6px; }
  .kv { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:9px 14px; }
  .kv .k { font-size:11px; color:var(--muted); }
  .kv .v { font-size:13.5px; font-weight:600; }
  .sk-seg { border:1px solid var(--line); border-radius:10px; padding:10px; margin-top:8px; background:#fcfcfe; }
  .sk-seg h5 { margin:0 0 6px; font-size:12.5px; display:flex; align-items:center; gap:8px; }
  .sk-seg h5 span.badge { font-size:10.5px; padding:1px 7px; border-radius:999px; background:#eef2ff; color:var(--accent-d); font-weight:600; }
  .sk-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(86px,1fr)); gap:5px 8px; }
  .sk-grid label { margin:0 0 2px; }
  .sk-grid input { padding:4px 6px; font-size:12px; }
  .sk-sub { font-size:11.5px; color:var(--accent-d); margin:9px 0 1px; font-weight:600; }
  .sk-note { width:100%; padding:5px 7px; border:1px solid var(--line); border-radius:7px; font-size:12px; }
  .dt-info-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:9px; margin-top:8px; }
  .dt-info-card { border:1px solid var(--line); border-radius:9px; padding:9px 11px; background:#f8f9fb; }
  .dt-info-card .dt-info-title { font-size:11px; color:var(--muted); margin-bottom:2px; }
  .dt-info-card .dt-info-body { font-size:13.5px; font-weight:600; word-break:break-all; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<header>
  <h1>法宝背包填充助手</h1>
  <p>「我要当老祖」辅助工具 · 不旋转多连块背包最大填充 · 灵枢宝鉴录入法宝，一键生成多套填充方案（含属性计算器）</p>
</header>

<main>
  <section>
    <!-- 1. 当前背包空间 -->
    <div class="card space-card">
      <h2>1. 当前背包空间</h2>
      <div class="space-body">
        <div class="space-controls">
          <div><label>宽度（列 C）</label><input type="number" id="cols" min="1" max="12" value="7"></div>
          <div><label>高度（行 R）</label><input type="number" id="rows" min="1" max="12" value="6"></div>
          <div class="full"><label>背包预设</label>
            <select id="preset">
              <option value="custom">自定义</option>
              <option value="4x4c">4×4 缺左上角（15 格）</option>
              <option value="5x5">5×5（25 格）</option>
              <option value="5x6">5×6（30 格）</option>
              <option value="6x6">6×6（36 格）</option>
              <option value="6x7" selected>6×7 满背包（42 格）</option>
            </select>
          </div>
          <div class="full"><label>点击格子切换「障碍格」（深色 = 不可放；其余参与填充）</label></div>
          <div><button id="applySize" class="ghost">应用行列</button></div>
          <div><button id="clearBlocked" class="ghost">清空障碍</button></div>
        </div>
        <div>
          <div id="spaceGrid" class="grid" style="width:max-content"></div>
          <div class="cap" id="capInfo"></div>
        </div>
      </div>
    </div>

    <!-- 2. 灵枢宝鉴（法宝清单，等价于对方「已有物品清单」表格；对方多余的「物品库模板/品质/旋转」等功能已删除） -->
    <div class="card lib-card">
      <h2>2. 灵枢宝鉴（法宝清单）</h2>
      <div class="row">
        <button id="selAll" class="ghost">全选</button>
        <button id="selNone" class="ghost">全不选</button>
        <button id="clearLib" class="ghost">清空宝鉴库</button>
        <button id="importBase" class="ghost">导入基础法宝库</button>
        <button id="importFile" class="ghost">📥 导入法宝库（Excel/CSV）</button>
        <input type="file" id="fileImport" accept=".xlsx,.xls,.csv" style="display:none">
        <span class="cap" style="margin:0 0 0 6px">已入册 <b id="libCount">0</b> 件 · 自动保存到本机，下次打开自动恢复</span>
        <span style="flex:1"></span>
        <input type="text" id="libSearch" class="inv-search" placeholder="搜索法宝名称…">
        <select id="groupFilter" style="width:auto;min-width:130px">
          <option value="all">全部组别</option>
          <option value="ungrouped">未分组</option>
        </select>
        <select id="invSort" style="width:auto;min-width:155px" title="法宝排序方式">
          <option value="cnt">排序：数量↓ · 格子↓</option>
          <option value="name">排序：名称</option>
          <option value="group">排序：组别</option>
          <option value="none">排序：录入顺序</option>
        </select>
        <div class="seg" id="libFilter">
          <button data-f="all">全部法宝</button>
          <button data-f="on" class="on">已启用</button>
          <button data-f="off">未启用</button>
        </div>
      </div>
      <div class="table-scroll mt">
        <table class="inv-table">
          <thead><tr>
            <th style="text-align:center">启用</th><th>名称</th><th style="text-align:center">重点</th><th>形状</th><th>组别</th>
            <th>生命</th><th>防御</th><th>攻击</th><th>加成率%</th><th>加成类型</th><th>加成属性</th><th>数量</th><th style="text-align:center">优先</th><th>操作</th>
          </tr></thead>
          <tbody id="invBody"></tbody>
        </table>
      </div>
      <div class="cap" id="invSummary"></div>
      <details class="group-panel">
        <summary>组别管理</summary>
        <div class="row" style="margin-top:8px">
          <input type="text" id="newGroupName" placeholder="新组名称" style="width:170px">
          <button id="newGroup" class="primary">＋ 新建组别</button>
        </div>
        <div class="group-list" id="groupList"></div>
      </details>
      <details class="cloud-panel" open>
        <summary>云端同步</summary>
        <div class="row" style="margin-top:8px;align-items:flex-end">
          <div><label>GitHub Token</label><input type="text" id="cloudUrl" placeholder="ghp_xxxxxxxxxxxx" style="width:300px"></div>
          <div><label>Gist ID（可空）</label><input type="text" id="cloudKey" placeholder="首次推送后自动生成" style="width:260px"></div>
          <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="cloudOn"> 启用同步</label>
        </div>
        <div class="row" style="margin-top:8px">
          <button id="cloudPull" class="ghost">⬇ 从 Gist 拉取</button>
          <button id="cloudPush" class="ghost">⬆ 立即推送到 Gist</button>
          <button id="cloudForce" class="ghost" title="清空 Gist 中所有旧法宝/组别，仅用当前本地数据覆盖（慎用）">🗑 强制覆盖 Gist</button>
          <span id="cloudStatus" class="cap" style="margin-left:6px"></span>
        </div>
      </details>
      <details class="add-panel">
        <summary>添加法宝</summary>
        <label>快捷形状（点击直接收入宝鉴）</label>
        <div class="toolbar" id="quickShapes"></div>
        <label class="mt">手绘法宝（点击格子组成形状，不可旋转）</label>
        <div id="drawGrid" class="grid" style="width:max-content"></div>
        <div class="space-controls" style="margin-top:8px;max-width:420px">
          <div><label>名称</label><input type="text" id="drawName" placeholder="如：L型法宝"></div>
          <div><label>数量</label><input type="number" id="drawCount" min="0" max="99" value="1"></div>
        </div>
        <label class="mt">属性与加成（可直接标注全部信息，录入即生效）</label>
        <div class="add-fields">
          <div><label>组别</label><select id="drawGroup"></select></div>
          <div><label>生命</label><input type="number" id="drawHp" min="0" value="0"></div>

<script>
/* ===================== 求解器核心（与 pack-core.js 一致，已通过 Node 测试） ===================== */
(function (global) {
  'use strict';
  function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
  function shuffle(arr,rng){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; }
  function normalizeShape(cells){ if(!cells.length) return []; let minR=Infinity,minC=Infinity; for(const [r,c] of cells){ if(r<minR)minR=r; if(c<minC)minC=c; } return cells.map(([r,c])=>[r-minR,c-minC]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]); }
  function shapeBounds(cells){ let h=0,w=0; for(const [r,c] of cells){ if(r+1>h)h=r+1; if(c+1>w)w=c+1; } return {h,w}; }
  function enumeratePlacements(R,C,shape,blocked){ const {h,w}=shapeBounds(shape); const placements=[]; for(let r0=0;r0<=R-h;r0++){ for(let c0=0;c0<=C-w;c0++){ const idxs=[]; let ok=true; for(const [r,c] of shape){ const idx=(r0+r)*C+(c0+c); if(blocked[idx]){ok=false;break;} idxs.push(idx); } if(ok) placements.push(idxs); } } return placements; }
  /* —— 基础填充：单一目标（最大化填充率），构造式贪心 + 多策略偏好，极快 —— */
  function canPlace(pl,occ){ for(const idx of pl) if(occ[idx]) return false; return true; }
  function placeOn(pl,occ){ for(const idx of pl) occ[idx]=1; }
  function strategyScore(pl,R,C,strategy){
    let minR=Infinity,minC=Infinity,maxR=-1,maxC=-1,sumR=0,sumC=0;
    for(const idx of pl){ const r=(idx/C)|0,c=idx%C; if(r<minR)minR=r; if(c<minC)minC=c; if(r>maxR)maxR=r; if(c>maxC)maxC=c; sumR+=r; sumC+=c; }
    const cr=sumR/pl.length, cc=sumC/pl.length, midR=(R-1)/2, midC=(C-1)/2;
    switch(strategy){
      case 'topleft':  return -(minR*C+minC);
      case 'center':   return -(Math.abs(cr-midR)+Math.abs(cc-midC));
      case 'corners':  { const d=Math.min(minR+minC, minR+(C-1-maxC), (R-1-maxR)+minC, (R-1-maxR)+(C-1-maxC)); return -d; }
      case 'diagonal': { let s=0; for(const idx of pl){ const r=(idx/C)|0,c=idx%C; s-=Math.abs(r-c); } return s/pl.length; }
      default:         return -(minR*C+minC);
    }
  }
  function greedyFill(R,C,blocked,infos,strategy,rng){
    const total=R*C; const occ=Uint8Array.from(blocked); const counts=infos.map(p=>p.count); const used=[];
    const hasPrio=infos.some(p=>p.priority);
    let order=infos.map((p,pi)=>pi);
    // 勾选优先时：优先法宝先放、且放内部（自身邻接空位最多 → 才能逼近“相邻法宝数=上限”），其余照常
    if(hasPrio) order.sort((a,b)=>(infos[b].priority-infos[a].priority)||(infos[b].size-infos[a].size)||(rng?rng()*2-1:0));
    else if(rng) order.sort((a,b)=>(infos[b].size-infos[a].size)||(rng()*2-1));
    else order.sort((a,b)=>infos[b].size-infos[a].size);
    for(const pi of order){
      while(counts[pi]>0){
        const pls=infos[pi].placements; let best=-1,bs=-Infinity;
        for(let k=0;k<pls.length;k++){ if(!canPlace(pls[k],occ)) continue;
          const s = infos[pi].priority ? perimFree(pls[k],R,C,blocked) : (strategy==='random'?rng():strategyScore(pls[k],R,C,strategy));
          if(s>bs){bs=s;best=k;} }
        if(best<0) break; placeOn(pls[best],occ); counts[pi]--; used.push({pi,pIdx:best});
      }
    }
    let filled=0; for(let i=0;i<total;i++) if(occ[i]&&!blocked[i]) filled++;
    return {filled,used,occ};
  }
  /* —— 后置评估：优先法宝“相邻法宝数量”——统计每个优先法宝四周相邻的【不同法宝实例】个数
         （围一圈 1×1 得 8、围一圈 2×2 得 4；上限由该法宝的邻接空位数决定，障碍格不计） —— */
  function neighborScore(R,C,occ,blocked,used,infos,prioritySet,instAt){
    let sc=0;
    used.forEach((u,instId)=>{
      if(!prioritySet.has(infos[u.pi].name)) return;
      const nb=new Set();
      for(const idx of infos[u.pi].placements[u.pIdx]){
        const r=(idx/C)|0,c=idx%C; const ns=[];
        if(r>0)ns.push(idx-C); if(r<R-1)ns.push(idx+C); if(c>0)ns.push(idx-1); if(c<C-1)ns.push(idx+1);
        for(const n of ns){ if(occ[n]&&!blocked[n]){ const oi=instAt[n]; if(oi>=0&&oi!==instId) nb.add(oi); } }
      }
      sc+=nb.size;
    });
    return sc;
  }
  /* —— 后置评估：1 格法宝「贴重点法宝」数量——统计每个 1 格法宝实例四周相邻（4-邻接）的【不同重点法宝实例】个数；
         用于「相同属性总分下，优先展示 1 格法宝更贴近重点法宝的组合」。 —— */
  function keyContactScore(R,C,used,infos,instAt,keySet,oneCellSet){
    let sc=0;
    used.forEach((u,instId)=>{
      if(!oneCellSet.has(infos[u.pi].name)) return;
      const nb=new Set();
      for(const idx of infos[u.pi].placements[u.pIdx]){
        const r=(idx/C)|0,c=idx%C; const ns=[];
        if(r>0)ns.push(idx-C); if(r<R-1)ns.push(idx+C); if(c>0)ns.push(idx-1); if(c<C-1)ns.push(idx+1);
        for(const n of ns){ if(instAt[n]>=0 && instAt[n]!==instId){ const oi=instAt[n]; if(keySet.has(infos[used[oi].pi].name)) nb.add(oi); } }
      }
      sc+=nb.size;
    });
    return sc;
  }
  /* —— 后置启发式：放置某块时的评分（目标感知）
        - edges：贴着越多已占格越紧凑；
        - 若贴到“优先法宝”：只贴 1 个邻接格 → 重奖（贡献 1 个互异邻居）；贴 2 个以上 → 重罚
          （一块占满优先法宝多个邻接位会让互异邻居数变少，必须避免）；
        - 优先法宝自身：奖励“自身邻接空位数”多（潜在可贴边上限更高）。 —— */
  function perimFree(pl,R,C,blocked){ const own=new Set(pl); let n=0; for(const idx of pl){ const r=(idx/C)|0,c=idx%C; const ns=[[r-1,c],[r+1,c],[r,c-1],[r,c+1]]; for(const [nr,nc] of ns){ if(nr<0||nr>=R||nc<0||nc>=C) continue; const ni=nr*C+nc; if(blocked[ni]||own.has(ni)) continue; n++; } } return n; }
  function heurScore(pl,occ,instAt,instName,selfId,isPrio,prioritySet,R,C,blocked){
    let edges=0; const touchedPrio=new Set(); let prioTouchEdges=0;
    for(const idx of pl){ const r=(idx/C)|0,c=idx%C; const ns=[[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
      for(const [nr,nc] of ns){ if(nr<0||nr>=R||nc<0||nc>=C) continue; const n=nr*C+nc;
        if(occ[n]){ edges++; const oi=instAt[n]; if(oi>=0&&oi!==selfId&&prioritySet.has(instName[oi])){ touchedPrio.add(oi); prioTouchEdges++; } } } }
    let h=edges;
    if(touchedPrio.size>0){ h += 60*touchedPrio.size - 45*(prioTouchEdges - touchedPrio.size); }
    if(isPrio) h+=perimFree(pl,R,C,blocked)*25+80;
    return h;
  }
  /* —— 后置优化：目标感知的 ruin‑recreate 局部搜索（随机游走 + 接受更优）
        邻域更大（每次移除 1~5 块，足以协调出 9 个互异邻居），对“用不同法宝贴优先法宝周边”给奖励，
        保证只在满填充（不改变填充率）的重构里接受，并始终跟踪全局最优。 —— */
  function refineFill(R,C,regionOcc,blocked,infos,prioritySet,K,seed,initUsed){
    const total=R*C;
    function build(used){ const occ=Uint8Array.from(blocked); const instAt=new Array(total).fill(-1); const instName=new Array(used.length).fill(null); used.forEach((u,instId)=>{ instName[instId]=infos[u.pi].name; for(const idx of infos[u.pi].placements[u.pIdx]){ occ[idx]=1; instAt[idx]=instId; } }); return {occ,instAt,instName}; }
    function scoreOf(used){ const {occ,instAt}=build(used); return neighborScore(R,C,occ,blocked,used,infos,prioritySet,instAt); }
    let regionCount=0; for(let i=0;i<total;i++) if(!blocked[i]) regionCount++;
    let current=initUsed.slice();
    let best={used:current.slice(),score:scoreOf(current)};
    for(let it=0;it<K;it++){
      const rng=mulberry32((seed+it*0x85EBCA6B)>>>0);
      const work=current.slice();
      const removeN=1+Math.floor(rng()*5);
      const pool=[...Array(work.length).keys()]; const idxs=[];
      for(let q=0;q<removeN&&pool.length;q++){ const j=Math.floor(rng()*pool.length); idxs.push(pool[j]); pool.splice(j,1); }
      const removed=idxs.map(i=>work[i]);
      const remaining=work.filter((_,i)=>!idxs.includes(i));
      const occ2=Uint8Array.from(blocked); const instAt2=new Array(total).fill(-1); const instName2=new Array(remaining.length).fill(null);
      remaining.forEach((u,instId)=>{ instName2[instId]=infos[u.pi].name; for(const idx of infos[u.pi].placements[u.pIdx]){ occ2[idx]=1; instAt2[idx]=instId; } });
      const order=removed.slice().sort((a,b)=>(infos[b.pi].priority-infos[a.pi].priority)||(rng()*2-1));
      let ok=true; const newUsed=remaining.slice(); let nextId=remaining.length;
      for(const u of order){
        const pls=infos[u.pi].placements; let bj=-1,bh=-Infinity;
        for(let j=0;j<pls.length;j++){ if(!canPlace(pls[j],occ2)) continue; const h=heurScore(pls[j],occ2,instAt2,instName2,nextId,infos[u.pi].priority,prioritySet,R,C,blocked); if(h>bh){bh=h;bj=j;} }
        if(bj<0){ ok=false; break; }
        placeOn(pls[bj],occ2); const instId=nextId++; for(const idx of pls[bj]) instAt2[idx]=instId; instName2[instId]=infos[u.pi].name;
        newUsed.push({pi:u.pi,pIdx:bj});
      }
      if(ok){ let f=0; for(let i=0;i<total;i++) if(occ2[i]&&!blocked[i]) f++; if(f===regionCount){ const sc=scoreOf(newUsed); if(sc>best.score) best={used:newUsed.slice(),score:sc}; current=newUsed; } }
    }
    return best;
  }
  // 按“每件法宝的摆放（类型+具体位置）”生成签名：满填充方案彼此占用格相同，必须用摆放区分，否则会被错误合并
  function sigOfUsed(used,infos,R,C){ const owner=new Array(R*C).fill('.'); used.forEach((u,instId)=>{ const lab=infos[u.pi].name+'#'+(u.pIdx); for(const idx of infos[u.pi].placements[u.pIdx]) owner[idx]=lab; }); return owner.join(','); }

  /* —— 计算某组已占用格的“邻接壳”（4-邻接、非障碍、非占用本身） —— */
  function shellMaskOf(R,C,occ,blocked){
    const m=new Uint8Array(R*C);
    for(let idx=0;idx<R*C;idx++){
      if(!occ[idx]||blocked[idx]) continue;
      const r=(idx/C)|0,c=idx%C;
      const ns=[[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
      for(const [nr,nc] of ns){ if(nr<0||nr>=R||nc<0||nc>=C) continue; const ni=nr*C+nc; if(!blocked[ni]&&!occ[ni]) m[ni]=1; }
    }
    return m;
  }
  /* —— 由 used 重建占用/实例映射（供评分） —— */
  function buildState(R,C,blocked,used,infos){
    const occ=Uint8Array.from(blocked); const instAt=new Array(R*C).fill(-1);
    used.forEach((u,instId)=>{ for(const idx of infos[u.pi].placements[u.pIdx]){ occ[idx]=1; instAt[idx]=instId; } });
    return {occ,instAt};
  }
  /* —— 有界精确回溯填充（方案 A 核心）——
       在 occ 已放置优先法宝的基础上，把其余法宝精确铺满剩余格。
       关键约束：任一块不得覆盖 ≥2 个壳格（否则一个实例占 2 壳格 → 互异邻居上限被压低）。
       在此约束下的完全填充必使每个壳格各被一个互异实例占据 → 分数 = 壳格数（理论极限）。 —— */
  function exactPack(R,C,blocked,infos,startOcc,startInstAt,startUsed,startCounts,startId,shellMask,opts){
    opts=opts||{};
    const total=R*C;
    const nodeCap=opts.nodeCap||120000;
    const deadline=opts.deadline||Infinity;
    const rng=opts.rng||Math.random;
    const counter={n:0,abort:false};
    const plByCell=infos.map(info=>{ const map=new Array(total); for(let i=0;i<total;i++) map[i]=[]; info.placements.forEach((pl,pi)=>{ for(const idx of pl) map[idx].push(pi); }); return map; });
    function orderTypes(counts){
      const arr=[]; for(let pi=0;pi<infos.length;pi++) if(counts[pi]>0) arr.push(pi);
      arr.sort((a,b)=> (infos[b].size-infos[a].size) || (rng()*2-1)); return arr;
    }
    const occ=Uint8Array.from(startOcc);
    const instAt=startInstAt.slice();
    const used=startUsed.slice();
    const counts=startCounts.slice();
    let nextId=startId;
    function placeValid(pl){ for(const idx of pl){ if(occ[idx]||blocked[idx]) return false; } return true; }
    function shellHits(pl){ let h=0; for(const idx of pl){ if(shellMask[idx]){ if(++h>=2) return h; } } return h; }
    function fill(){
      if(counter.abort) return null;
      if(++counter.n>nodeCap){ counter.abort=true; return null; }
      if(Date.now()>deadline){ counter.abort=true; return null; }
      let bestCell=-1,bestOpts=Infinity;
      for(let idx=0;idx<total;idx++){
        if(occ[idx]||blocked[idx]) continue;
        let oc=0;
        for(let pi=0;pi<infos.length;pi++){ if(counts[pi]<=0) continue; const lst=plByCell[pi][idx]; for(let k=0;k<lst.length;k++){ if(placeValid(infos[pi].placements[lst[k]])){ oc++; break; } } }
        if(oc<bestOpts){ bestOpts=oc; bestCell=idx; if(oc===0) break; }
      }
      if(bestCell<0) return used.slice();
      const types=orderTypes(counts);
      for(const pi of types){
        const lst=plByCell[pi][bestCell];
        for(let k=0;k<lst.length;k++){
          const pl=infos[pi].placements[lst[k]];
          if(!placeValid(pl)) continue;
          if(shellHits(pl)>=2) continue;
          for(const idx of pl) occ[idx]=1;
          const id=nextId++; instAt[bestCell]=id; for(const idx of pl) instAt[idx]=id;
          used.push({pi,pIdx:lst[k]}); counts[pi]--;
          const res=fill();
          if(res) return res;
          counts[pi]++; used.pop();
          for(const idx of pl){ occ[idx]=0; instAt[idx]=-1; }
          nextId--;
        }
      }
      return null;
    }
    return fill();
  }
  /* —— 属性总分（逐行复刻 UI 层 computeAttributes：同组别才触发 self/buff 加成） —— */
  function buildOcc(used,infos,total,blocked){ const occ=Uint8Array.from(blocked); used.forEach(u=>{ for(const idx of infos[u.pi].placements[u.pIdx]) occ[idx]=1; }); return occ; }
  function attrTotalsOfUsed(used,infos,R,C){
    const N=used.length; const owner=new Array(R*C).fill(-1);
    used.forEach((u,ii)=>{ for(const idx of infos[u.pi].placements[u.pIdx]) owner[idx]=ii; });
    const sameGroup=(a,b)=> !!(a&&b && a.group!=null && b.group!=null && a.group===b.group);
    const adj=[];
    for(let ii=0;ii<N;ii++){ const s=new Set();
      for(const idx of infos[used[ii].pi].placements[used[ii].pIdx]){ const r=(idx/C)|0,c=idx%C;
        for(const [nr,nc] of [[r-1,c],[r+1,c],[r,c-1],[r,c+1]]){ if(nr<0||nr>=R||nc<0||nc>=C) continue; const j=owner[nr*C+nc]; if(j>=0&&j!==ii) s.add(j); } }
      adj.push(s); }
    const totals={hp:0,def:0,atk:0};
    for(let ii=0;ii<N;ii++){ const m=infos[used[ii].pi].attr; const b={hp:Number(m.hp)||0,def:Number(m.def)||0,atk:Number(m.atk)||0};

  function emptyEff(){
    return { dmg:{atk:0,def:0,hpMax:0,shield:0}, shield:{atk:0,def:0,hpMax:0},
             gainPre:{lianti:0,jinshen:0,chuishi:0,fatian:0}, gain:{lianti:0,jinshen:0,chuishi:0,fatian:0}, note:'' };
  }
  function mkEff(o){
    const e=emptyEff(); o=o||{};
    if(o.dmg) Object.assign(e.dmg,o.dmg);
    if(o.shield) Object.assign(e.shield,o.shield);
    if(o.gainPre) Object.assign(e.gainPre,o.gainPre);
    if(o.gain) Object.assign(e.gain,o.gain);
    if(o.note) e.note=String(o.note);
    return e;
  }
  function normalizeSkill(sk){
    if(!sk || typeof sk!=='object') return null;
    const cyc = (Array.isArray(sk.cycle)&&sk.cycle.length) ? sk.cycle.map(mkEff) : [emptyEff()];
    return { on: sk.on!==false, every: Math.max(1,Number(sk.every)||1), from: Math.max(1,Number(sk.from)||1),
             hold: sk.hold!==false, cycle: cyc, desc: String(sk.desc||'') };
  }

  /* ---------- 灵枢宝鉴：本地持久化（自动保存，避免重复录入） ---------- */
  const LIB_KEY = 'treasurePackLibrary_v1';
  const GRP_KEY = 'treasurePackGroups_v1';
  function saveLocalOnly(){
    try{
      const data = library.map(serializeLibItem);
      localStorage.setItem(LIB_KEY, JSON.stringify(data));
      localStorage.setItem(GRP_KEY, JSON.stringify(groups.map(g=>({id:g.id,name:g.name,enabled:!!g.enabled}))));
    }catch(e){ /* localStorage 不可用（如隐私模式）时静默忽略 */ }
  }
  function saveLibrary(){ saveLocalOnly(); schedulePush(); }
  function loadLibrary(){
    try{
      const raw = localStorage.getItem(LIB_KEY); if(!raw) return false;
      const arr = JSON.parse(raw); if(!Array.isArray(arr)) return false;
      const grp = JSON.parse(localStorage.getItem(GRP_KEY)||'[]');
      hydrate(arr, Array.isArray(grp)?grp:[]);
      return arr.length>0;
    }catch(e){ return false; }
  }
  /* 由数组水合（本地加载与远程同步共用）；启用中的组别会默认勾选其法宝、数量置 0
     主键改为「名称」：法宝 id=名称、组别 id=名称；旧数据(T1/G1 形式)在加载时自动重映射为名称主键。 */
  function hydrate(arr, grpArr){
    library.length=0; Object.keys(sel).forEach(k=>delete sel[k]); tid=0; gidCounter=0; groups.length=0;
    const grpRemap={};
    (grpArr||[]).forEach(g=>{ const gid=String(g.name||g.id||('组别'+(gidCounter+1))); grpRemap[String(g.id||gid)]=gid; gidCounter++; groups.push({id:gid, name:gid, enabled:!!g.enabled}); });
    (arr||[]).forEach(t=>{ tid++;
      const nm=String(t.name||t.id||('法宝'+tid));
      const id=nm;
      const rawGrp=t.group||null;
      const grpId = rawGrp? (grpRemap[String(rawGrp)]||String(rawGrp)) : null;
      const g = grpId? groups.find(x=>x.id===grpId):null;
      const inc = !grpId || (g? !!g.enabled : true); // 强关联：分组法宝仅在对应组别已启用时才启用
      const base=(typeof t.base==='object'&&t.base)?{ hp:Number(t.base.hp)||0, def:Number(t.base.def)||0, atk:Number(t.base.atk)||0 }:{ hp:Number(t.base)||0, def:0, atk:0 };
      library.push({ id, name:nm, cells:PackCore.normalizeShape(t.cells||[[0,0]]), color:t.color||colorOf(library.length), base, bonusRate:Number(t.bonusRate)||0, bonusType:t.bonusType||'none', bonusAttr:t.bonusAttr||'hp', count:Math.max(0,t.count||0), group:grpId, key:!!t.key, skill:t.skill?normalizeSkill(t.skill):null });
      const sc=Math.max(0,t.count||0);
      sel[id]={include:inc,count:sc,priority:false};
    });
  }
  /* 导入/恢复工作簿中的 7 组基础法宝库（按 组别+名称 去重，不覆盖用户自定义法宝） */
  function importBaseLibrary(){
    DEFAULT_GROUPS.forEach(bg=>{
      let g = groups.find(x=>x.id===bg.id);
      if(!g){ gidCounter++; g={id:bg.id,name:bg.name,enabled:false}; groups.push(g); }
      else { g.enabled = false; }
    });
    let added=0;
    DEFAULT_LIBRARY.forEach(t=>{
      if(library.some(x=>x.group===t.group && x.name===t.name)) return;
      const id=uniqueName(t.name);
      library.push({ id, name:t.name, cells:PackCore.normalizeShape(t.cells), color:colorOf(library.length), base:{hp:Number(t.base.hp)||0,def:Number(t.base.def)||0,atk:Number(t.base.atk)||0}, bonusRate:Number(t.bonusRate)||0, bonusType:t.bonusType||'none', bonusAttr:t.bonusAttr||'hp', count:0, group:t.group, key:false, skill:null });
      sel[id]={include:false,count:0,priority:false};
      added++;
    });
    renderInventory(); renderGroups(); saveLibrary();
    return added;
  }
  /* ===================== 云端同步：GitHub Gist（按名称主键「并集合并」，跨设备离线编辑互不覆盖） =====================
     作用：把法宝库（名称/形状/属性/组别）作为跨设备的共享数据源。
     推送：把本地并入 Gist（同名本地胜）；拉取：把 Gist 并入本地（同名 Gist 胜）。
     因此双方各自离线编辑后，互相推送+拉取即可补全为全集，不会互相覆盖。
     未配置或离线时自动回退本地 localStorage，行为不变。 */
  const CLOUD_KEY='treasurePackGist';
  function cloudCfg(){ try{ return JSON.parse(localStorage.getItem(CLOUD_KEY)||'null'); }catch(e){ return null; } }
  function cloudReady(){ const c=cloudCfg(); return !!(c&&c.on&&c.token); }        // 有 Token 即可推送（无 Gist ID 时首次推送自动创建）
  function gistPullReady(){ const c=cloudCfg(); return !!(c&&c.on&&c.token&&c.gistId); }
  function setCloudStatus(m){ const el=document.getElementById('cloudStatus'); if(el) el.textContent=m; }
  const GIST_FILE='treasure-pack-data.json';
  // 删除墓碑（tombstone）：被删除的法宝名称集合，随 Gist 跨设备传播，确保“删除”也能同步
  const DELETED_KEY='treasurePackGistDeleted';
  function loadDeleted(){ try{ const a=JSON.parse(localStorage.getItem(DELETED_KEY)||'[]'); return new Set(Array.isArray(a)?a:[]); }catch(e){ return new Set(); } }
  function saveDeleted(s){ try{ localStorage.setItem(DELETED_KEY, JSON.stringify([...s])); }catch(e){} }
  let deletedNames = loadDeleted();
  async function gistApi(path, method, body){
    const c=cloudCfg(); if(!c||!c.token) throw new Error('未配置 GitHub Token');
    const res=await fetch('https://api.github.com'+path,{
      method,
      headers:{ 'Authorization':'Bearer '+c.token, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json', 'X-GitHub-Api-Version':'2022-11-28' },
      body: body? JSON.stringify(body):undefined
    });
    if(!res.ok){
      let txt=''; try{ const j=await res.json(); txt=JSON.stringify(j&&j.message?j.message:j); }catch(e){ try{ txt=await res.text(); }catch(e2){} }
      throw new Error('HTTP '+res.status+' '+(txt||res.statusText));
    }
    return res.status===204? null : (await res.json().catch(()=>null));
  }
  // 按名称主键做「并集合并」：同名法宝取 one 方（胜方）覆盖，其余并集。
  // 这是跨设备离线编辑后能互相补全、互不覆盖的关键。
  function mergeItems(a, b){
    const map=new Map();
    (a||[]).forEach(t=>{ if(t&&(t.id||t.name)!=null) map.set(String(t.id||t.name), t); });
    (b||[]).forEach(t=>{ if(t&&(t.id||t.name)!=null) map.set(String(t.id||t.name), t); }); // b 覆盖 a
    return [...map.values()];
  }
  function mergeGroups(a, b){
    const map=new Map();
    (a||[]).forEach(g=>{ if(g&&(g.id||g.name)!=null) map.set(String(g.id||g.name), g); });
    (b||[]).forEach(g=>{ if(g&&(g.id||g.name)!=null) map.set(String(g.id||g.name), g); });
    return [...map.values()];
  }
  function gistPayload(){
    return { version:1, library:library.map(serializeLibItem), groups:groups.map(g=>({id:g.id,name:g.name,enabled:!!g.enabled})), deleted:[...deletedNames] };
  }
  // 用合并后的「存储态」重建本地 library/groups，并尽量保留本地已有的勾选(sel)状态
  function rebuildFromMerged(libStored, grpStored){
    library.length=0; groups.length=0;
    (grpStored||[]).forEach(g=>{ groups.push({id:String(g.id||g.name), name:String(g.name||g.id), enabled:!!g.enabled}); });
    const grpMap=new Map(groups.map(g=>[g.id,g]));
    (libStored||[]).forEach(t=>{
      const id=String(t.id||t.name);
      const grpId = t.group?String(t.group):null;
      const g = grpId?grpMap.get(grpId):null;
      const grpOff = !!(grpId && g && !g.enabled);
      library.push({ id, name:String(t.name||t.id), cells:PackCore.normalizeShape(t.cells||[[0,0]]), color:t.color||colorOf(library.length),
        base:(t.base&&typeof t.base==='object')?{hp:Number(t.base.hp)||0,def:Number(t.base.def)||0,atk:Number(t.base.atk)||0}:{hp:0,def:0,atk:0},
        bonusRate:Number(t.bonusRate)||0, bonusType:t.bonusType||'none', bonusAttr:t.bonusAttr||'hp',
        count:Math.max(0,Number(t.count)||0), group:grpId, key:!!t.key, skill:t.skill?normalizeSkill(t.skill):null });
      if(!sel[id]) sel[id]={ include:!grpOff, count:Math.max(0,Number(t.count)||0), priority:false };
    });
    tid=library.length; gidCounter=groups.length;
  }
  async function pushToCloud(){
    if(!cloudReady()){ setCloudStatus('请先填写 GitHub Token 并勾选启用'); return; }
    const c=cloudCfg();
    try{
      const local=gistPayload();
      let base={ version:1, library:[], groups:[], deleted:[] };
      if(c.gistId){
        try{
          const g=await gistApi('/gists/'+encodeURIComponent(c.gistId),'GET');
          const f=g.files && g.files[GIST_FILE];
          if(f&&f.content){ const d=JSON.parse(f.content); if(Array.isArray(d.library)) base={ version:1, library:d.library, groups:d.groups||[], deleted:d.deleted||[] }; }
        }catch(e){ /* 读不到旧数据则当作空 */ }
      }
      // 合并删除墓碑：本地 + 云端 已删除名称的并集
      const del=new Set([...(base.deleted||[]), ...deletedNames]);
      // 合并法宝：本地覆盖 Gist 中同名项（不会丢失对方已上传的法宝），再剔除墓碑项
      const mergedLib=mergeItems(base.library, local.library).filter(t=>!del.has(String(t.id||t.name)));
      const mergedGrp=mergeGroups(base.groups, local.groups);
      deletedNames=del; saveDeleted(del);
      const content=JSON.stringify({ version:1, library:mergedLib, groups:mergedGrp, deleted:[...del] }, null, 2);
      const body={ files:{ [GIST_FILE]:{ content } } };
      if(c.gistId){
        await gistApi('/gists/'+encodeURIComponent(c.gistId),'PATCH',body);
        setCloudStatus('☁ 已合并同步到 Gist（'+mergedLib.length+' 件法宝 / '+mergedGrp.length+' 组，已删除 '+del.size+'）');
      }else{
        const g=await gistApi('/gists','POST',Object.assign({ description:'法宝背包填充助手 - 云端同步数据', public:false }, body));
        c.gistId=g.id; localStorage.setItem(CLOUD_KEY, JSON.stringify(c));
        setCloudStatus('☁ 已创建 Gist 并同步（'+mergedLib.length+' 件法宝 / '+mergedGrp.length+' 组）');
      }
    }catch(e){ setCloudStatus('推送失败：'+(e&&e.message||e)); }
  }
  let _pushTimer=null;
  function schedulePush(){ if(_pushTimer) clearTimeout(_pushTimer); _pushTimer=setTimeout(()=>{ if(cloudReady()) pushToCloud().catch(e=>setCloudStatus('自动推送失败：'+(e&&e.message||e))); }, 800); }
  async function pullFromCloud(){
    if(!gistPullReady()){ setCloudStatus('请先填写 Token 与 Gist ID 并勾选启用'); return; }
    try{
      const c=cloudCfg();
      const g=await gistApi('/gists/'+encodeURIComponent(c.gistId),'GET');
      const f=g.files && g.files[GIST_FILE];
      if(!f||!f.content){ setCloudStatus('Gist 中暂无数据（可先点“立即推送”上传本地数据）'); return; }
      const data=JSON.parse(f.content);
      // 合并删除墓碑：本地 + 云端 已删除名称的并集
      const del=new Set([...(data.deleted||[]), ...deletedNames]);
      deletedNames=del; saveDeleted(del);
      // 合并：Gist 覆盖本地同名项，其余并集，再剔除墓碑项
      const mergedLib=mergeItems(library.map(serializeLibItem), data.library||[]).filter(t=>!del.has(String(t.id||t.name)));
      const mergedGrp=mergeGroups(groups.map(g=>({id:g.id,name:g.name,enabled:!!g.enabled})), data.groups||[]);
      if(mergedLib.length===0 && mergedGrp.length===0){ setCloudStatus('Gist 为空（或所法宝均已被删除）'); renderInventory(); renderGroups(); renderQuickShapes(); return; }
      rebuildFromMerged(mergedLib, mergedGrp);
      saveLocalOnly(); renderInventory(); renderGroups(); renderQuickShapes();
      setCloudStatus('☁ 已从 Gist 拉取并合并（'+mergedLib.length+' 件法宝 / '+mergedGrp.length+' 组，已删除 '+del.size+'）');
    }catch(e){ setCloudStatus('拉取失败：'+(e&&e.message||e)); }
  }
  async function forceOverwriteGist(){
    if(!cloudReady()){ setCloudStatus('请先填写 GitHub Token 并勾选启用'); return; }
    const c=cloudCfg();
    try{
      const local=gistPayload();
      const content=JSON.stringify({ version:1, library:local.library, groups:local.groups, deleted:[] }, null, 2);
      const body={ files:{ [GIST_FILE]:{ content } } };
      if(c.gistId){
        await gistApi('/gists/'+encodeURIComponent(c.gistId),'PATCH',body);
      }else{
        const g=await gistApi('/gists','POST',Object.assign({ description:'法宝背包填充助手 - 云端同步数据', public:false }, body));
        c.gistId=g.id; localStorage.setItem(CLOUD_KEY, JSON.stringify(c));
      }
      deletedNames=new Set(); saveDeleted(deletedNames);
      setCloudStatus('☁ 已强制覆盖 Gist（'+local.library.length+' 件法宝 / '+local.groups.length+' 组，删除标记已清空）');
    }catch(e){ setCloudStatus('覆盖失败：'+(e&&e.message||e)); }
  }
  function setupCloudUI(){
    const cfg=cloudCfg()||{};
    if($('cloudUrl')) $('cloudUrl').value=cfg.token||'';      // 复用控件：此处为 GitHub Token
    if($('cloudKey')) $('cloudKey').value=cfg.gistId||'';      // 复用控件：此处为 Gist ID（可空）
    if($('cloudOn')) $('cloudOn').checked=!!cfg.on;
    const saveCfg=()=>{ const o={ token:($('cloudUrl').value||'').trim(), gistId:($('cloudKey').value||'').trim(), on:$('cloudOn').checked }; localStorage.setItem(CLOUD_KEY, JSON.stringify(o)); return o; };
    $('cloudOn').onchange=()=>{ const o=saveCfg(); if(o.on&&o.token){ setCloudStatus('正在同步…'); if(o.gistId){ pullFromCloud().catch(()=>{}); } else { pushToCloud().catch(()=>{}); } } else setCloudStatus('已关闭云端同步'); };
    $('cloudUrl').onchange=saveCfg; $('cloudKey').onchange=saveCfg;
    $('cloudPull').onclick=()=>{ const o=saveCfg(); if(!o.token||!o.gistId){ setCloudStatus('请先填写 Token 与 Gist ID'); return; } pullFromCloud(); };
    $('cloudPush').onclick=()=>{ saveCfg(); pushToCloud(); };
    $('cloudForce').onclick=()=>{ const o=saveCfg(); if(!o.token){ setCloudStatus('请先填写 GitHub Token 并勾选启用'); return; } if(!confirm('确定要强制覆盖 Gist 吗？\n将清空 Gist 中所有旧的法宝/组别，仅保留你当前本地的数据（删除标记也会清空）。此操作不可撤销。')) return; forceOverwriteGist(); };
    if(!cfg.token) setCloudStatus('未配置：需 GitHub Token（勾选 gist 权限）');
  }

  /* ===================== 导入接口：Excel/CSV（按法宝名称主键合并/批量修改） ===================== */
  function parseCSV(text){
    const rows=[]; let row=[], cur='', q=false, depth=0;
    for(let i=0;i<text.length;i++){ const c=text[i];
      if(q){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; continue; }
      if(c==='"'){ q=true; continue; }
      if(c==='['){ depth++; cur+='['; continue; }
      if(c===']'){ depth--; cur+=']'; continue; }
      if(depth>0){ cur+=c; continue; }
      if(c===','){ row.push(cur); cur=''; continue; }
      if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; continue; }
      if(c==='\r'){ continue; }

  function parseCells(s){

  const BT_MAP={'':'none','自身受加成':'self','给他人加成':'buff','self':'self','buff':'buff','none':'none'};
  const BA_MAP={'':'hp','生命力':'hp','生命':'hp','防御力':'def','防御':'def','攻击力':'atk','攻击':'atk','hp':'hp','def':'def','atk':'atk'};
  function applyImportRows(rows){
    if(!rows||rows.length===0) return {added:0,updated:0,skipped:0};
    const headers=rows[0].map(c=>String(c).trim());
    const isHeader=headers.some(h=>/名称|名字|法宝/.test(h) || /形状|图形/.test(h));
    let map;
    if(isHeader){
      map={};
      headers.forEach((h,ci)=>{
        if(/名称|名字|法宝名/.test(h)) map.name=ci;
        else if(/形状|图形|shape/i.test(h)) map.cells=ci;
        else if(/^组别$|组$/.test(h)) map.group=ci;
        else if(/生命/.test(h)) map.hp=ci;
        else if(/防御/.test(h)) map.def=ci;
        else if(/攻击/.test(h)) map.atk=ci;
        else if(/加成率|加成%/.test(h)) map.bonusRate=ci;
        else if(/加成类型|类型/.test(h)) map.bonusType=ci;
        else if(/加成属性|属性/.test(h)) map.bonusAttr=ci;
        else if(/重点|重要|关键|key/i.test(h)) map.key=ci;
      });
      rows=rows.slice(1);
    } else {
      map={name:0,cells:1,group:2,hp:3,def:4,atk:5,bonusRate:6,bonusType:7,bonusAttr:8};
    }
    let added=0,updated=0,skipped=0;
    rows.forEach(r=>{
      const name=String(r[map.name]!=null?r[map.name]:'').trim();
      if(!name){ skipped++; return; }
      const group=(map.group!=null?String(r[map.group]!=null?r[map.group]:'').trim():'')||null;
      if(group && !groups.find(g=>g.id===group)){ gidCounter++; groups.push({id:group,name:group,enabled:false}); }
      // 强关联：分组法宝仅在对应组别已启用时才能被启用（新增/更新均遵循此规则）
      const gObj=group?groups.find(x=>x.id===group):null;
      const grpEnabled = !group || (gObj? !!gObj.enabled : true);
      const cells=parseCells(map.cells!=null?r[map.cells]:'');
      const hp=numOr0(map.hp!=null?r[map.hp]:0), def=numOr0(map.def!=null?r[map.def]:0), atk=numOr0(map.atk!=null?r[map.atk]:0);
      const bonusRate=numOr0(map.bonusRate!=null?r[map.bonusRate]:0);
      const bonusType=BT_MAP[String(map.bonusType!=null?r[map.bonusType]:'').trim()]||'none';
      const bonusAttr=BA_MAP[String(map.bonusAttr!=null?r[map.bonusAttr]:'').trim()]||'hp';
      const keyVal = map.key!=null ? /(是|true|1|√|yes|重点)/i.test(String(r[map.key]||'')) : false;
      const existing=library.find(t=>t.name===name);
      if(existing){
        existing.cells=PackCore.normalizeShape(cells);
        existing.group=group;
        existing.base={hp,def,atk};
        existing.bonusRate=bonusRate; existing.bonusType=bonusType; existing.bonusAttr=bonusAttr;
        existing.key=keyVal; existing.count=Math.max(0,existing.count||0);
        if(sel[existing.id]){ if(!grpEnabled) sel[existing.id].include=false; sel[existing.id].count=Math.max(0,sel[existing.id].count||0); }
        updated++;
      } else {
        const id=uniqueName(name);
        library.push({id,name,cells:PackCore.normalizeShape(cells),color:colorOf(library.length),base:{hp,def,atk},bonusRate,bonusType,bonusAttr,count:0,group,key:keyVal,skill:null});

  // 按真实字节嗅探文件类型：扩展名不可靠——Excel 把工作簿另存为 .csv 时实际仍是
  // ZIP(xlsx) 二进制（会被当成文本读出乱码），而真正的 .csv 在中文 Windows 上多为 GBK 文本。
  function isZipBytes(buf){ return buf && buf.byteLength>=4 && new Uint8Array(buf,0,4).join(',')==='80,75,3,4'; } // 'PK\x03\x04'
  function decodeCsvText(buf){
    const u8=new Uint8Array(buf);
    if(u8[0]===0xEF && u8[1]===0xBB && u8[2]===0xBF) return new TextDecoder('utf-8').decode(u8); // 带 UTF-8 BOM
    try{ return new TextDecoder('utf-8',{fatal:true}).decode(u8); } // 先试 UTF-8（严格）
    catch(e){ try{ return new TextDecoder('gbk').decode(u8); }catch(e2){ return new TextDecoder('utf-8').decode(u8); } } // 失败回退 GBK（中文 Excel 默认 ANSI/GBK）
  }
  function importTreasureFile(file){
    const fname=file.name.toLowerCase();
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        let rows;
        const asCsv=(fname.endsWith('.csv')||fname.endsWith('.txt')) && !isZipBytes(reader.result);
        if(asCsv){
          rows=parseCSV(decodeCsvText(reader.result));
        } else {
          if(typeof XLSX==='undefined'){ alert('解析 .xlsx 需要联网加载表格解析库（SheetJS）。\n请联网后重试，或将文件另存为 .csv 后导入（CSV 无需联网）。'); return; }
          const wb=XLSX.read(new Uint8Array(reader.result),{type:'array'});
          const ws=wb.Sheets[wb.SheetNames[0]];
          rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        }
        const r=applyImportRows(rows);
        renderInventory(); renderGroups(); saveLibrary();
        $('statusBox').textContent='📥 导入完成：新增 '+r.added+' 件，更新 '+r.updated+' 件，跳过 '+r.skipped+' 行空白（按法宝名称主键合并，已自动去重）。';
      }catch(err){ alert('导入失败：'+(err&&err.message||err)); }
    };

  }

  /* ---------- 一键生成（多批次 + 跨批全局最优合并） ---------- */
  let poolGlobal=[], sigGlobal=new Set(), lastBestW=0, batchSeedBase=20260721, lastRecord=false;
  function sigOfPlan(p){ return p.placements.map(pl=>pl.name+':'+pl.cells.map(c=>c.join(',')).join(';')).sort().join('|'); }
  function buildPieces(){
    const chosen=library.filter(t=>{ const s=sel[t.id]; return s&&s.include&&(s.count||0)>0; });
    return chosen.map(t=>{ const s=sel[t.id]; return { name:t.id, cells:t.cells, count:s.count, priority:s.priority, key:t.key, hp:t.base&&t.base.hp||0, def:t.base&&t.base.def||0, atk:t.base&&t.base.atk||0, bonusRate:t.bonusRate||0, bonusType:t.bonusType||'none', bonusAttr:t.bonusAttr||'hp', group:t.group||null }; });
  }
  function doSolve(seed, accumulate){
    const chosen=library.filter(t=>{ const s=sel[t.id]; return s&&s.include&&(s.count||0)>0; });
    if(chosen.length===0){ return {empty:true}; }
    const pieces=buildPieces();
    const backpack={ rows:bagRows(), cols:bagCols(), blocked:[...bagBlocked] };
    const weights=readWeights();
    const plans=PackCore.generatePlans(backpack,pieces,{seed,runsPerStrategy:500,timeLimitMs:1500,weights});
    if(!accumulate){ poolGlobal=[]; sigGlobal=new Set(); lastBestW=0; }
    for(const p of plans){ const sg=sigOfPlan(p); if(!sigGlobal.has(sg)){ sigGlobal.add(sg); poolGlobal.push(p); } }
    poolGlobal.forEach(p=>{ if(p.weighted==null) p.weighted=weightedScore(p.totals,weights); });
    const bestNow=poolGlobal.reduce((m,p)=>Math.max(m,p.weighted||0),0);
    let record=false; if(accumulate && bestNow>lastBestW+1e-6) record=true; lastBestW=Math.max(lastBestW,bestNow);
    return {empty:false, fullAchievable: plans.length?plans[0].fullAchievable:false, backpack, record, bestNow};
  }
  function renderMerged(ms){
    renderPlans(poolGlobal, lastBackpack, ms);
    if(lastRecord && poolGlobal.length){ const sb=$('statusBox'); if(sb) sb.textContent='🏆 刷新纪录（跨批全局最优属性评分 '+Math.round(lastBestW)+'） · '+sb.textContent; }
  }
  function runBatches(){
    const N=Math.max(1,Math.min(12, parseInt($('batches').value)||3));
    const enabledCount=library.filter(t=>sel[t.id]&&sel[t.id].include).length;
    const chosen=library.filter(t=>{ const s=sel[t.id]; return s&&s.include&&(s.count||0)>0; });

    batchSeedBase=(Date.now()&0x7fffffff);
    $('statusBox').textContent='⏳ 生成中…（'+N+' 批次合并）';
    $('solve').disabled=true; if($('reshuffle')) $('reshuffle').disabled=true;
    setTimeout(()=>{
      const t0=performance.now(); lastRecord=false;

      const ms=(performance.now()-t0).toFixed(0);
      $('solve').disabled=false; if($('reshuffle')) $('reshuffle').disabled=false;
      if(back) lastBackpack=back;

  /* ===================== 计算器：整体属性（生命/防御/攻击 + 邻接百分比加成，按属性分别结算） =====================
       对每个法宝 i，最终属性按三项分别结算：
         最终.attr = 基础.attr × 自身加成倍率 × 他人加成倍率
         自身加成倍率 = 1 + 加成率% × 相邻不同法宝数   （仅当加成类型=自身受加成 且 加成属性=attr）
         他人加成倍率 = 1 + Σ(相邻“给他人加成”法宝 j 且 加成属性=attr 的 加成率%)
       全部无加成 → 倍率均为 1 → 三项直接求和。
       整体属性 = 所有法宝最终属性的分项求和。 */
  function computeAttributes(plan,libMap,R,C){
    const sameGroup=(a,b)=> !!(a&&b && a.group!=null && b.group!=null && a.group===b.group);
    const items = plan.placements.map(p=>({ name:p.name, cells:p.cells, m: libMap[p.name] || {hp:0,def:0,atk:0,bonusRate:0,bonusAttr:'hp',bonusType:'none'} }));
    const N = items.length;
    const occ = new Array(R*C).fill(-1);
    items.forEach((it,ii)=> it.cells.forEach(([r,c])=>{ occ[r*C+c]=ii; }));
    const adj = items.map(()=> new Set());   // 每个法宝相邻的不同法宝（实例）集合
    for(let ii=0; ii<N; ii++){
      for(const [r,c] of items[ii].cells){
        for(const [nr,nc] of [[r-1,c],[r+1,c],[r,c-1],[r,c+1]]){
          if(nr<0||nr>=R||nc<0||nc>=C) continue;
          const j=occ[nr*C+nc]; if(j>=0&&j!==ii) adj[ii].add(j);
        }
      }
    }
    const finalAttrs = items.map(()=>({hp:0,def:0,atk:0}));
    const totals = {hp:0,def:0,atk:0};
    for(let ii=0; ii<N; ii++){
      const m = items[ii].m;
      const b = { hp:Number(m.hp)||0, def:Number(m.def)||0, atk:Number(m.atk)||0 };
      // 自身受加成：仅统计「同组别」的相邻法宝
      const selfMult = {hp:1,def:1,atk:1};
      if(m.bonusType==='self' && m.bonusAttr){
        const rate=(Number(m.bonusRate)||0)/100;
        let k=0; for(const j of adj[ii]){ if(sameGroup(m, items[j].m)) k++; }
        selfMult[m.bonusAttr] = 1 + rate*k;
      }
      // 他人加成：仅来自「同组别」且类型为“给他人加成”的相邻法宝
      const buffMult = {hp:1,def:1,atk:1};
      for(const j of adj[ii]){
        const mj = items[j].m;
        if(mj.bonusType==='buff' && mj.bonusAttr && sameGroup(mj, m)){
          const rate=(Number(mj.bonusRate)||0)/100;
          buffMult[mj.bonusAttr] += rate;
        }
      }
      finalAttrs[ii].hp = b.hp*selfMult.hp*buffMult.hp;
      finalAttrs[ii].def = b.def*selfMult.def*buffMult.def;
      finalAttrs[ii].atk = b.atk*selfMult.atk*buffMult.atk;
      totals.hp += finalAttrs[ii].hp;
      totals.def += finalAttrs[ii].def;
      totals.atk += finalAttrs[ii].atk;
    }
    return { per: items.map((it,ii)=>({id:it.name, hp:finalAttrs[ii].hp, def:finalAttrs[ii].def, atk:finalAttrs[ii].atk})), totals };
  }

  /* ===================== 配置保存 / 读取 ===================== */
  function serializeConfig(){ return { library: library.map(t=>{ const s=sel[t.id]||{}; return {id:t.id,name:t.name,cells:t.cells,base:{hp:t.base&&t.base.hp||0,def:t.base&&t.base.def||0,atk:t.base&&t.base.atk||0},bonusRate:t.bonusRate||0,bonusType:t.bonusType||'none',bonusAttr:t.bonusAttr||'hp',group:t.group||null,count:s.count||0,priority:!!s.priority,include:s.include!==false}; }), backpack:{rows:bagRows(),cols:bagCols(),blocked:[...bagBlocked]} }; }
  function saveConfig(){
    const cfg=serializeConfig();
    try{ localStorage.setItem('treasurePackConfig',JSON.stringify(cfg)); }catch(e){}
    const blob=new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='法宝背包配置.json'; a.click(); URL.revokeObjectURL(a.href);
    $('statusBox').textContent='💾 配置已保存到浏览器(localStorage)并下载 JSON 文件。';
  }
  function loadConfig(cfg){
    if(!cfg||!Array.isArray(cfg.library)) return false;
    library.length=0; Object.keys(sel).forEach(k=>delete sel[k]); tid=0;
    cfg.library.forEach(t=>{ tid++; const nm=String(t.name||t.id||('法宝'+tid)); const id=nm; const base=(typeof t.base==='object'&&t.base)?{hp:Number(t.base.hp)||0,def:Number(t.base.def)||0,atk:Number(t.base.atk)||0}:{hp:Number(t.base)||0,def:0,atk:0}; library.push({id,name:nm,cells:PackCore.normalizeShape(t.cells||[[0,0]]),color:colorOf(library.length),base,bonusRate:Number(t.bonusRate)||0,bonusType:t.bonusType||'none',bonusAttr:t.bonusAttr||'hp',group:t.group||null,count:Math.max(0,t.count||0)}); sel[id]={include:t.include!==false,count:Math.max(0,t.count||0),priority:!!t.priority}; });
    if(cfg.backpack){ $('rows').value=cfg.backpack.rows; $('cols').value=cfg.backpack.cols; bagBlocked=new Set((cfg.backpack.blocked||[]).filter(i=>i>=0)); }
    $('preset').value='custom'; renderInventory(); renderBagGrid(); saveLibrary(); return true;
  }
  function exportResult(){
    if(!lastPlans||!lastPlans.length){ alert('请先生成方案'); return; }
    const data={ backpack:lastBackpack, plans:lastPlans };
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='法宝背包方案.json'; a.click(); URL.revokeObjectURL(a.href);
  }
  let lastPlans=null,lastBackpack=null,lastMs=0;
  $('saveCfg').onclick=saveConfig;
  $('loadCfg').onclick=()=>$('fileInput').click();
  $('fileInput').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ if(loadConfig(JSON.parse(rd.result))) $('statusBox').textContent='📂 配置已载入。'; else $('statusBox').textContent='⚠️ 配置文件格式不正确。'; }catch(err){ $('statusBox').textContent='⚠️ JSON 解析失败：'+err.message; } }; rd.readAsText(f); e.target.value=''; };
  $('exportResult').onclick=exportResult;
  $('sortMode').onchange=()=>{ if(lastPlans) renderPlans(lastPlans,lastBackpack,lastMs); };

  /* ===================== 渲染方案（含计算器结果） ===================== */
  /* ---------- 属性格式化 / 权重读取 / 加权评分 ---------- */
  function fmt(n){ return Math.round(n).toLocaleString('en-US'); }
  function readWeights(){
    let hp=Number($('wHp').value)||0, atk=Number($('wAtk').value)||0, def=Number($('wDef').value)||0;
    const rawSum=hp+atk+def; const msg=$('wMsg');
    if(rawSum<=0){ hp=34; atk=33; def=33; }
    const sum=hp+atk+def||1;
    const w={hp:hp/sum*100, atk:atk/sum*100, def:def/sum*100};
    if(msg){ msg.textContent = (Math.round(rawSum)===100)?'权重合计 100 ✓（按此加权）':'权重合计 '+Math.round(rawSum)+'，已自动按比例归一化'; }
    return w;
  }
  function weightedScore(totals,w){ return totals.hp*(w.hp/100) + totals.atk*w.atk + totals.def*w.def; }

  /* —— 方案网格渲染：沿用原小格子，仅给每件法宝加粗边缘线 + 内部左上角编号 —— */
  function renderPieceGrid(plan,R,C,cellSize,colorById){
    const total=R*C;
    const cellPiece=new Int16Array(total); cellPiece.fill(-1);
    plan.placements.forEach((p,pi)=>{
      p.cells.forEach(([r,c])=>{ const idx=r*C+c; cellPiece[idx]=pi; });
    });
    // 关键：所有格子统一 border-box + 固定尺寸 + 零 gap + 零 margin
    // → 行列轨道尺寸完全一致，不会出现整行横线或错位；分隔只靠边框，不占布局空间
    const sz='box-sizing:border-box;width:'+cellSize+'px;height:'+cellSize+'px';
    let h='<div class="grid pg-grid" style="grid-template-columns:repeat('+C+','+cellSize+'px);gap:0">';
    for(let r=0;r<R;r++) for(let c=0;c<C;c++){
      const idx=r*C+c;
      if(bagBlocked.has(idx)){ h+='<div class="cell blocked" style="'+sz+'"></div>'; continue; }
      const pi=cellPiece[idx];
      if(pi<0){ h+='<div class="cell" style="'+sz+'"></div>'; continue; }
      const p=plan.placements[pi];
      const color=colorById[p.name]||'#ccc';
      // 仅在不同件/空/边界处画外缘线
      const bt=(r===0||cellPiece[idx-C]!==pi), bb=(r===R-1||cellPiece[idx+C]!==pi);
      const bl=(c===0||cellPiece[idx-1]!==pi), br=(c===C-1||cellPiece[idx+1]!==pi);
      let bc=''; if(bt)bc+=' pg-bt'; if(bb)bc+=' pg-bb'; if(bl)bc+=' pg-bl'; if(br)bc+=' pg-br';
      // 只有「两条相邻边都是外缘」的角才圆角，内部角一律直角 → 同件无缝、外缘规整
      const rTL=(bt&&bl)?3:0, rTR=(bt&&br)?3:0, rBR=(bb&&br)?3:0, rBL=(bb&&bl)?3:0;
      const rad='border-radius:'+rTL+'px '+rTR+'px '+rBR+'px '+rBL+'px;';
      h+='<div class="cell pg-cell2'+bc+'" style="'+sz+';background:'+color+';'+rad+'"></div>';
    }
    h+='</div>';
    return h;
  }

  function renderPlans(plans,backpack,ms){
    lastPlans=plans; lastBackpack=backpack; lastMs=ms;
    $('exportResult').disabled = !(plans&&plans.length);
    const R=backpack.rows,C=backpack.cols;
    const colorById={}; const idName={}; const libMap={};
    library.forEach(t=>{ colorById[t.id]=t.color; idName[t.id]=t.name; libMap[t.id]={ hp:t.base&&t.base.hp||0, def:t.base&&t.base.def||0, atk:t.base&&t.base.atk||0, bonusRate:t.bonusRate||0, bonusType:t.bonusType||'none', bonusAttr:t.bonusAttr||'hp', group:t.group||null }; });
    const weights=readWeights();
    plans.forEach(p=>{ const a=computeAttributes(p,libMap,R,C); p.totals=a.totals; p.perAttrs=a.per; p.weighted=weightedScore(a.totals,weights); });
    const mode=$('sortMode')?$('sortMode').value:'attr';
    const sorted=plans.slice();
    if(mode==='score') sorted.sort((a,b)=>b.score-a.score||(b.keyContact-a.keyContact)||b.fill-a.fill);
    else if(mode==='fill') sorted.sort((a,b)=>b.fill-a.fill||(b.keyContact-a.keyContact)||b.score-a.score);
    else sorted.sort((a,b)=>b.weighted-a.weighted||(b.keyContact-a.keyContact));  // attr / 默认：按属性总分；同分下优先 1 格法宝贴重点法宝更多
    const hasPrio=library.some(t=>sel[t.id]&&sel[t.id].priority);
    const hasOneCell=library.some(t=>sel[t.id]&&(sel[t.id].count||0)>0&&t.cells.length===1);
    const needN=hasPrio?5:10;
    const view=sorted.slice(0,needN);
    // 注意：usedOf 在每个方案卡片内部单独计算（按单方案统计），不跨方案累加
    const top0=sorted.length?sorted[0]:null;
    const bestFill=top0?top0.bestFill:0, cap=top0?top0.capacity:0;
    const scoreNote=(hasPrio&&top0)?' · 最高相邻法宝数 '+top0.score:'';
    let attrNote='';
    if(top0){ if(mode==='attr') attrNote=' · 最高属性评分 '+Math.round(top0.weighted); else attrNote=' · 顶配 生命'+fmt(top0.totals.hp)+'/防御'+fmt(top0.totals.def)+'/攻击'+fmt(top0.totals.atk); }
    const fillWarn=(top0&&top0.fullAchievable===false)?'⚠️ 当前法宝组合无法完全填满，已展示最接近填满的方案 · ':'';
    $('statusBox').textContent=fillWarn+'✅ 基础填充 '+(top0?top0.runs:'-')+' 次 · 候选池 '+(plans.length)+' 套（已合并跨批） · 最高填充 '+bestFill+'/'+cap+' 格'+scoreNote+attrNote+' · 耗时 '+ms+'ms'+(sorted.length<needN?' · 不同布局不足 '+needN+' 套':'');
    // 统计块
    const stat=(k,v)=>'<div class="stat"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';
    $('statsBlock').innerHTML =
      stat('生命值', top0?fmt(top0.totals.hp):'-') +
      stat('防御力', top0?fmt(top0.totals.def):'-') +
      stat('攻击力', top0?fmt(top0.totals.atk):'-') +
      stat('属性评分', (mode==='attr'&&top0)?Math.round(top0.weighted):'-') +
      stat('相邻法宝数', (hasPrio&&top0)?top0.score:'-') +
      stat('1格贴重点', (hasOneCell&&top0)?top0.keyContact:'-') +
      stat('已用格子', top0?top0.filled+'/'+top0.capacity:'-') +
      stat('已放物品', top0?top0.placements.length:'-') +
      stat('搜索耗时', ms+'ms') +
      stat('候选池', plans.length+'（跨批合并）');
    const wrap=$('plans'); wrap.innerHTML='';
    if(sorted.length===0){ wrap.innerHTML='<div class="empty-note">未找到可行方案，请减少法宝数量或扩大背包。</div>'; renderPlanDetail(null); return; }
    function selectPlan(i){
      const plan=view[i];
      wrap.querySelectorAll('.plan-card').forEach(c=>c.classList.remove('selected'));
      const card=wrap.querySelector('.plan-card[data-idx="'+i+'"]'); if(card) card.classList.add('selected');
      // 详情面板也用单方案统计
      const usedOf={}; library.forEach(t=>usedOf[t.id]=0);
      plan.placements.forEach(pl=>{ if(usedOf[pl.name]!=null) usedOf[pl.name]++; });
      renderPlanDetail(plan,R,C,idName,usedOf,hasPrio);
    }
    view.forEach((plan,i)=>{
      // 按当前方案单独统计每件法宝的摆放实例数（不跨方案累加）
      const usedOf={}; library.forEach(t=>usedOf[t.id]=0);
      plan.placements.forEach(pl=>{ if(usedOf[pl.name]!=null) usedOf[pl.name]++; });
      const card=document.createElement('div'); card.className='plan-card';
      const rate=(plan.capacity?plan.filled/plan.capacity*100:0);
      const ratePill='<span class="pill '+(rate>=99?'ok':'warn')+'">填充率 '+rate.toFixed(1)+'%</span>';
      const fullPill=plan.filled===plan.capacity?'<span class="pill ok">满填充</span>':'<span class="pill warn">填充 '+plan.filled+'/'+plan.capacity+'</span>';
      const scorePill=(hasPrio)?'<span class="pill" style="background:#3b82f6;color:#fff">相邻法宝 '+plan.score+'</span>':'';
      const kcPill=(hasOneCell)?'<span class="pill" style="background:#0ea5a4;color:#fff">1格贴重点 '+plan.keyContact+'</span>':'';
      const wPill=(mode==='attr')?'<span class="pill" style="background:#7c3aed;color:#fff">属性评分 '+Math.round(plan.weighted)+'</span>':'';
      const t=plan.totals||{hp:0,def:0,atk:0};
      const attrLine='<div class="attr-line">生命 '+fmt(t.hp)+' · 防御 '+fmt(t.def)+' · 攻击 '+fmt(t.atk)+'</div>';
      const gridHtml=renderPieceGrid(plan,R,C,24,colorById);
      let legHtml='<div class="legend">'; library.forEach(t2=>{ const u=usedOf[t2.id]; if(u>0){ const left=sel[t2.id].count-u; legHtml+='<div class="item"><span class="sw" style="background:'+t2.color+'"></span>'+escapeHtml(t2.name)+' <b>'+u+'/'+(sel[t2.id].count)+'</b>'+(left>0?' <span style="color:var(--warn)">(剩'+left+')</span>':'')+(sel[t2.id].priority?' <span style="color:var(--accent2)">★优先</span>':'')+'</div>'; } });
      const leftTre=library.filter(t2=>sel[t2.id]&&sel[t2.id].include&&(sel[t2.id].count-(usedOf[t2.id]||0))>0);
      if(leftTre.length){ legHtml+='<div class="item" style="color:var(--warn)">未放: '+leftTre.map(t2=>escapeHtml(t2.name)+'×'+(sel[t2.id].count-usedOf[t2.id])).join('、')+'</div>'; }
      legHtml+='</div>';
      const text=buildPlanText(plan,R,C,i+1,idName);
      card.innerHTML='<h3>方案 '+(i+1)+' '+ratePill+' '+fullPill+' '+scorePill+' '+kcPill+' '+wPill+'</h3>'+gridHtml+legHtml+attrLine;
      const pre=document.createElement('pre'); pre.className='plan-text'; pre.textContent=text; pre.style.display='none';
      const btn=document.createElement('button'); btn.className='ghost'; btn.textContent='查看/复制文本';
      btn.onclick=(e)=>{ e.stopPropagation(); const show=pre.style.display!=='block'; pre.style.display=show?'block':'none'; if(show&&navigator.clipboard) navigator.clipboard.writeText(text); };
      const bar=document.createElement('div'); bar.className='planbar'; bar.appendChild(btn);
      card.appendChild(bar); card.appendChild(pre);
      card.dataset.idx=i; card.onclick=()=>selectPlan(i);
      wrap.appendChild(card);
    });
    if(view.length) selectPlan(0);
  }
  /* ---------- 右侧详情面板：点击某方案卡后实时渲染其摆放与属性明细 ---------- */
  function renderPlanDetail(plan,R,C,idName,usedOf,hasPrio){
    const box=$('planDetail');
    if(!plan){ box.innerHTML='<div class="pd-empty">点击左侧任意方案，此处实时显示该方案的摆放与属性详情。</div>'; return; }
    const colorById={}; library.forEach(t=>colorById[t.id]=t.color);
    const gridHtml=renderPieceGrid(plan,R,C,20,colorById);
    let legHtml='<div class="legend" style="margin-top:6px">';
    library.forEach(t=>{ const u=usedOf[t.id]; if(u>0){ const left=sel[t.id].count-u; legHtml+='<div class="item"><span class="sw" style="background:'+t.color+'"></span>'+escapeHtml(t.name)+' <b>'+u+'/'+(sel[t.id].count)+'</b>'+(left>0?' <span style="color:var(--warn)">(剩'+left+')</span>':'')+(sel[t.id].priority?' <span style="color:var(--accent2)">★优先</span>':'')+'</div>'; } });
    const leftTre=library.filter(t=>sel[t.id]&&sel[t.id].include&&(sel[t.id].count-(usedOf[t.id]||0))>0);
    if(leftTre.length){ legHtml+='<div class="item" style="color:var(--warn)">未放: '+leftTre.map(t=>escapeHtml(t.name)+'×'+(sel[t.id].count-usedOf[t.id])).join('、')+'</div>'; }
    legHtml+='</div>';
    // 分项属性明细（按法宝聚合）
    const perMap={}; const infoMap={};
    (plan.perAttrs||[]).forEach(pa=>{ if(!perMap[pa.id]) perMap[pa.id]={hp:0,def:0,atk:0}; perMap[pa.id].hp+=pa.hp; perMap[pa.id].def+=pa.def; perMap[pa.id].atk+=pa.atk; });
    library.forEach(t=>{ infoMap[t.id]={bonusType:t.bonusType||'none',bonusAttr:t.bonusAttr||'hp',bonusRate:t.bonusRate||0}; });
    let tbl='<table class="pd-table"><thead><tr><th>法宝</th><th>数量</th><th>生命</th><th>防御</th><th>攻击</th><th>加成</th></tr></thead><tbody>';
    Object.keys(perMap).forEach(id=>{ const p=perMap[id]; const info=infoMap[id]||{}; const bt=info.bonusType; let bonus='—';
      if(bt==='self') bonus='自身+'+(info.bonusRate||0)+'%'+(info.bonusAttr==='def'?'防御':info.bonusAttr==='atk'?'攻击':'生命')+'(同组)';
      else if(bt==='buff') bonus='给他+'+(info.bonusRate||0)+'%'+(info.bonusAttr==='def'?'防御':info.bonusAttr==='atk'?'攻击':'生命')+'(同组)';
      const cnt=usedOf[id]||0; tbl+='<tr><td>'+escapeHtml(idName[id]||id)+'</td><td>'+cnt+'</td><td>'+fmt(p.hp)+'</td><td>'+fmt(p.def)+'</td><td>'+fmt(p.atk)+'</td><td>'+bonus+'</td></tr>'; });
    const t=plan.totals||{hp:0,def:0,atk:0};
    tbl+='<tr class="pd-total"><td>合计</td><td></td><td>'+fmt(t.hp)+'</td><td>'+fmt(t.def)+'</td><td>'+fmt(t.atk)+'</td><td></td></tr>';
    tbl+='</tbody></table>';
    const text=buildPlanText(plan,R,C,1,idName);
    const hasOneCell = library.some(t=>sel[t.id] && (sel[t.id].count||0)>0 && t.cells.length===1);
    box.innerHTML='<h4>方案详情 · 生命 '+fmt(t.hp)+' / 防御 '+fmt(t.def)+' / 攻击 '+fmt(t.atk)+(hasPrio?' · 相邻法宝 '+plan.score:'')+(hasOneCell?' · 1格贴重点 '+plan.keyContact:'')+'</h4>'+gridHtml+legHtml+tbl;
    const btn=document.createElement('button'); btn.className='ghost pd-copy'; btn.textContent='复制方案文本';
    btn.onclick=(e)=>{ e.stopPropagation(); if(navigator.clipboard) navigator.clipboard.writeText(text); };
    box.appendChild(btn);
  }

  function buildPlanText(plan,R,C,no,idName){
    let txt='【法宝背包填充方案 '+no+'】\n';
    txt+='背包 '+R+'×'+C+'，容量 '+plan.capacity+' 格（障碍 '+plan.blocked+'）\n';
    const rate=plan.capacity?plan.filled/plan.capacity*100:0;
    txt+='已填充 '+plan.filled+' 格，填充率 '+rate.toFixed(1)+'%，共放置 '+plan.placements.length+' 个法宝\n';
    txt+='坐标以(行,列)表示，均从 1 开始；按锚点(左上角)排序：\n';
    txt+='————————————————————\n';
    const sorted=plan.placements.slice().sort((a,b)=>a.anchor[0]-b.anchor[0]||a.anchor[1]-b.anchor[1]);
    sorted.forEach((p,i)=>{ const coords=p.cells.map(([r,c])=>'('+(r+1)+','+(c+1)+')').join(' '); txt+=(i+1)+'. '+(idName[p.name]||p.name)+' @锚点('+(p.anchor[0]+1)+','+(p.anchor[1]+1)+') 占 '+coords+'\n'; });
    const totals=plan.totals||{hp:0,def:0,atk:0};
    txt+='————————————————————\n';
    txt+='属性合计（含邻接加成）：生命 '+fmt(totals.hp)+' · 防御 '+fmt(totals.def)+' · 攻击 '+fmt(totals.atk)+'\n';
    const perMap={}; (plan.perAttrs||[]).forEach(pa=>{ perMap[pa.id]=perMap[pa.id]||{hp:0,def:0,atk:0}; perMap[pa.id].hp+=pa.hp; perMap[pa.id].def+=pa.def; perMap[pa.id].atk+=pa.atk; });
    Object.keys(perMap).forEach(id=>{ txt+='  '+(idName[id]||id)+'：生命 '+fmt(perMap[id].hp)+' · 防御 '+fmt(perMap[id].def)+' · 攻击 '+fmt(perMap[id].atk)+'\n'; });
    if(plan.weighted!=null) txt+='属性评分（加权）：'+Math.round(plan.weighted)+'\n';
    return txt;
  }

  /* ---------- 初始化 ---------- */
  const libRestored = loadLibrary();
  renderQuickShapes(); renderDraw(); renderInventory(); renderBagGrid(); renderGroups();
  $('clearLib').onclick=()=>{ if(library.length===0){ alert('宝鉴库已为空'); return; } if(confirm('确认清空本地宝鉴库？所有已保存的法宝（名称/形状/属性）将被删除且不可恢复。')){ library.length=0; Object.keys(sel).forEach(k=>delete sel[k]); tid=0; try{ localStorage.removeItem(LIB_KEY); localStorage.removeItem(GRP_KEY); localStorage.removeItem('treasurePackBase_v1'); }catch(e){} renderInventory(); renderGroups(); $('statusBox').textContent='🗑 本地宝鉴库已清空。'; } };
  $('importBase').onclick=()=>{ const n=importBaseLibrary(); $('statusBox').textContent='📥 已导入/合并基础法宝库，本次新增 '+n+' 件（共 '+library.length+' 件，7 组均默认未启用；在「组别管理」勾选需要的组别即可启用法宝，数量默认 0）。'; };
  $('importFile').onclick=()=>$('fileImport').click();
  $('fileImport').onchange=e=>{ const f=e.target.files[0]; if(f) importTreasureFile(f); e.target.value=''; };
  $('saveHistory').onclick=captureHistory;
  $('clearHistory').onclick=()=>{ if(confirm('确认清空全部历史求解记录？')){ try{ localStorage.removeItem(HIST_KEY); }catch(e){} renderHistory(); $('statusBox').textContent='🗑 历史求解记录已清空。'; } };
  renderHistory();
  // 首次打开（无本机数据 或 尚未导入过基础库）自动导入工作簿中的 7 组基础法宝库
  const baseFlag = (localStorage.getItem('treasurePackBase_v1')==='1');
  if(!libRestored || !baseFlag){
    const n = importBaseLibrary();
    try{ localStorage.setItem('treasurePackBase_v1','1'); }catch(e){}
    $('statusBox').textContent='📚 已导入基础法宝库（'+library.length+' 件，金/木/水/火/土/雷/体 7 组）。在「组别管理」勾选所需组别即可启用对应法宝（数量默认 0，填写数量后点「一键生成」）。';
  } else if(libRestored){
    $('statusBox').textContent='📚 已从本地宝鉴库自动恢复 '+library.length+' 件法宝（勾选组别并填写数量后即可点「一键生成」）。';
  }

  setupCloudUI();
  if(gistPullReady()){ setCloudStatus('正在从 Gist 拉取…'); pullFromCloud().then(()=>{ renderInventory(); renderGroups(); }); }
})();
</script>
